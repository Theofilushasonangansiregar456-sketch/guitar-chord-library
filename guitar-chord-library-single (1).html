<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Chord Library</title>
  <meta name="description" content="Perpustakaan chord gitar dengan diagram chord interaktif.">
  <style>
*{box-sizing:border-box}
:root{
  --bg:#f4f1e9; --paper:#fbfaf5; --ink:#24211d; --muted:#777168;
  --line:#cfc8b9; --accent:#a33124; --accent2:#6f2119; --card:#fffdf8;
  --shadow:0 8px 28px rgba(50,43,30,.08)
}
:root.dark{
  --bg:#181714; --paper:#211f1b; --ink:#eee9df; --muted:#aaa296;
  --line:#49443b; --accent:#e06a5c; --accent2:#ff8a7b; --card:#24221e;
  --shadow:0 12px 30px rgba(0,0,0,.25)
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.topbar{height:68px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2))}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:22px}
.brand strong{display:block;font-size:16px}
.brand span{display:block;color:var(--muted);font:12px Arial,sans-serif;margin-top:3px}
.icon-btn{border:1px solid var(--line);background:transparent;color:var(--ink);width:38px;height:38px;border-radius:7px;cursor:pointer;font-size:17px}
.container{width:min(1180px,calc(100% - 36px));margin:auto}
.hero{padding:42px 0 28px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent);font:bold 11px Arial,sans-serif;letter-spacing:2px;margin:0 0 9px}
h1{font-size:42px;line-height:1;margin:0 0 12px;font-weight:500}
.hero-text{max-width:680px;color:var(--muted);margin:0;font-size:15px;line-height:1.65}
.stats{text-align:right;border-left:1px solid var(--line);padding-left:28px}
.stats b{display:block;font-size:28px;color:var(--accent)}
.stats span{font:11px Arial,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.controls{display:grid;grid-template-columns:1fr 180px 180px;gap:12px;padding:22px 0}
.search-wrap,.select-wrap{border:1px solid var(--line);background:var(--paper);min-height:44px}
.search-wrap{display:flex;align-items:center;padding:0 13px;gap:8px}
.search-wrap span{font:22px Arial;color:var(--muted)}
.search-wrap input{border:0;outline:0;background:transparent;color:var(--ink);width:100%;font:14px Arial}
.select-wrap{display:flex;align-items:center;padding:0 10px;gap:7px}
.select-wrap label{font:10px Arial;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
select{border:0;outline:0;background:transparent;color:var(--ink);font:13px Arial;width:100%;cursor:pointer}
.root-tabs{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:24px}
.root-tab{appearance:none;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:11px 16px;cursor:pointer;font:bold 12px Arial}
.root-tab:hover,.root-tab.active{color:var(--accent);background:var(--paper)}
.library{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;padding-bottom:50px}
.group-title{grid-column:1/-1;margin:16px 0 2px;padding-bottom:7px;border-bottom:1px solid var(--line);font-size:19px;font-weight:500}
.group-title span{color:var(--accent);font-size:13px;margin-left:5px}
.chord-card{background:var(--card);border:1px solid var(--line);min-height:190px;padding:10px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:.16s}
.chord-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.chord-name{font:bold 13px Arial;margin:1px 0 5px}
.chord-type{font:10px Arial;color:var(--muted);margin-bottom:5px}
.diagram{width:116px;height:132px;display:block}
.string{stroke:var(--ink);stroke-width:1.15}
.fret{stroke:var(--ink);stroke-width:.8}
.border{stroke:var(--ink);stroke-width:1}
.nut{fill:var(--ink)}
.open{fill:none;stroke:var(--ink);stroke-width:1.4}
.dot{fill:var(--ink)}
.mark{fill:var(--ink);font:11px Arial}
.pos{fill:var(--muted);font:8px Arial}
.card-footer{width:100%;display:flex;justify-content:space-between;color:var(--muted);font:9px Arial;margin-top:auto;padding-top:3px}
.empty{grid-column:1/-1;padding:55px;text-align:center;border:1px dashed var(--line);color:var(--muted)}
.modal{display:none;position:fixed;inset:0;z-index:20}
.modal.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.52)}
.modal-card{position:relative;width:min(520px,calc(100% - 28px));margin:8vh auto;background:var(--paper);border:1px solid var(--line);padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.25)}
.modal-close{position:absolute;right:12px;top:9px;border:0;background:transparent;color:var(--muted);font-size:28px;cursor:pointer}
.detail{display:grid;grid-template-columns:210px 1fr;gap:25px;align-items:center}
.detail .diagram{width:190px;height:210px}
.detail h2{font-size:32px;margin:0 0 5px}
.detail .sub{color:var(--accent);font:12px Arial;text-transform:uppercase;letter-spacing:1px}
.detail p{color:var(--muted);font:13px Arial;line-height:1.6}
.detail ul{padding-left:18px;color:var(--muted);font:12px Arial;line-height:1.8}
footer{border-top:1px solid var(--line);padding:18px max(22px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;color:var(--muted);font:10px Arial}
@media(max-width:900px){.library{grid-template-columns:repeat(4,1fr)}.controls{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}}
@media(max-width:620px){.hero{display:block}.stats{text-align:left;border-left:0;padding:15px 0 0}.controls{grid-template-columns:1fr}.library{grid-template-columns:repeat(2,1fr)}.root-tab{flex:1 0 16.6%;padding:10px 4px}.detail{grid-template-columns:1fr;text-align:center}.detail svg{margin:auto}h1{font-size:34px}footer{display:block;line-height:1.8}}

  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">♬</div>
      <div>
        <strong>Guitar Chord Library</strong>
        <span>Chord diagrams &amp; reference</span>
      </div>
    </div>
    <button id="themeBtn" class="icon-btn" title="Ganti tema">☾</button>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">GUITAR REFERENCE</p>
        <h1>Guitar Chords</h1>
        <p class="hero-text">Cari chord berdasarkan nada dan jenisnya. Setiap kartu menampilkan diagram senar, fret, dan posisi jari.</p>
      </div>
      <div class="stats">
        <b id="totalCount">0</b>
        <span>chord tersedia</span>
      </div>
    </section>

    <section class="controls">
      <div class="search-wrap">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Cari chord, contoh: C, Am, G7...">
      </div>
      <div class="select-wrap">
        <label for="rootFilter">Nada</label>
        <select id="rootFilter">
          <option value="all">Semua</option>
        </select>
      </div>
      <div class="select-wrap">
        <label for="typeFilter">Jenis</label>
        <select id="typeFilter">
          <option value="all">Semua jenis</option>
        </select>
      </div>
    </section>

    <nav id="rootTabs" class="root-tabs" aria-label="Pilih nada"></nav>

    <section id="library" class="library"></section>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <article class="modal-card">
      <button class="modal-close" data-close>×</button>
      <div id="modalContent"></div>
    </article>
  </div>

  <footer>
    <span>Guitar Chord Library</span>
    <span>Standard tuning · E A D G B E</span>
  </footer>

  <script>
const roots = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const rootPC = {C:0,"C#":1,D:2,Eb:3,E:4,F:5,"F#":6,G:7,Ab:8,A:9,Bb:10,B:11};

const types = [
  {id:"",name:"Major",suffix:"",tones:[0,4,7]},
  {id:"m",name:"Minor",suffix:"m",tones:[0,3,7]},
  {id:"7",name:"Dominant 7",suffix:"7",tones:[0,4,7,10]},
  {id:"maj7",name:"Major 7",suffix:"maj7",tones:[0,4,7,11]},
  {id:"m7",name:"Minor 7",suffix:"m7",tones:[0,3,7,10]},
  {id:"sus2",name:"Suspended 2",suffix:"sus2",tones:[0,2,7]},
  {id:"sus4",name:"Suspended 4",suffix:"sus4",tones:[0,5,7]},
  {id:"dim",name:"Diminished",suffix:"dim",tones:[0,3,6]},
  {id:"aug",name:"Augmented",suffix:"aug",tones:[0,4,8]},
  {id:"6",name:"Sixth",suffix:"6",tones:[0,4,7,9]},
  {id:"m6",name:"Minor 6",suffix:"m6",tones:[0,3,7,9]},
  {id:"9",name:"Dominant 9",suffix:"9",tones:[0,4,7,10,2]},
  {id:"maj9",name:"Major 9",suffix:"maj9",tones:[0,4,7,11,2]},
  {id:"m9",name:"Minor 9",suffix:"m9",tones:[0,3,7,10,2]},
  {id:"add9",name:"Add 9",suffix:"add9",tones:[0,4,7,2]},
  {id:"7sus4",name:"7 Sus 4",suffix:"7sus4",tones:[0,5,7,10]},
  {id:"5",name:"Power",suffix:"5",tones:[0,7]},
  {id:"m7b5",name:"Half Diminished",suffix:"m7b5",tones:[0,3,6,10]}
];

// Standard tuning low E -> high E.
const strings = [4,9,2,7,11,4];
const tuningNames = ["E","A","D","G","B","E"];

function pcAt(stringIndex,fret){return (strings[stringIndex]+fret)%12}

// Find a compact playable voicing. This is a generated reference voicing;
// common open/barre shapes are preferred when available.
function makeVoicing(root, type){
  const target = new Set(type.tones.map(x=>(rootPC[root]+x)%12));
  const candidates = [];

  for(let base=0;base<=9;base++){
    const opts=[];
    for(let s=0;s<6;s++){
      const choices=[-1];
      for(let f=0;f<=12;f++){
        if(f===0 || f>=base && f<=base+4){
          if(target.has(pcAt(s,f))) choices.push(f);
        }
      }
      opts.push(choices);
    }
    let states=[[]];
    for(let s=0;s<6;s++){
      const next=[];
      for(const st of states) for(const f of opts[s]) next.push([...st,f]);
      states=next.slice(0,7000);
    }
    for(const frets of states){
      const played=frets.map((f,i)=>f>=0?pcAt(i,f):null).filter(x=>x!==null);
      const unique=new Set(played);
      if(!unique.has(rootPC[root])) continue;
      const covered=[...target].filter(x=>unique.has(x)).length;
      if(covered < Math.min(3,target.size)) continue;
      const sounding=frets.filter(f=>f>=0).length;
      if(sounding<2) continue;
      const used=frets.filter(f=>f>0);
      const span=used.length?Math.max(...used)-Math.min(...used):0;
      if(span>4) continue;
      const muted=frets.filter(f=>f<0).length;
      const open=frets.filter(f=>f===0).length;
      const score=covered*30+sounding*5+open*8-span*7-muted*2-(base*1.5);
      candidates.push({frets,score});
    }
    if(candidates.length>120) break;
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]?.frets || [-1,-1,-1,-1,-1,-1];
}

const cache = new Map();
function getVoicing(root,type){
  const key=root+"|"+type.id;
  if(!cache.has(key)) cache.set(key,makeVoicing(root,type));
  return cache.get(key);
}

function diagramSVG(frets, small=false){
  const w=small?116:190,h=small?126:205;
  const left=small?18:30, top=small?23:32;
  const gridW=small?80:130, gridH=small?78:126;
  const sx=gridW/5, sy=gridH/5;
  const positive=frets.filter(f=>f>0);
  let min=Math.min(...positive,1);
  let max=Math.max(...positive,5);
  let start=(max-min>4)?max-4:Math.max(1,min);
  if(frets.some(f=>f===0)) start=1;
  const fretLabels=Array.from({length:6},(_,i)=>start+i);
  const parts=[];
  // strings
  for(let s=0;s<6;s++){
    const x=left+s*sx;
    parts.push(`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+gridH}" class="string"/>`);
  }
  // frets
  // Garis fret: dibuat lebih tegas dan lengkap seperti diagram chord pada referensi.
  for(let f=0;f<=6;f++){
    const y=top+f*(gridH/6);
    parts.push(`<line x1="${left}" y1="${y}" x2="${left+gridW}" y2="${y}" class="fret"/>`);
  }
  // Garis bingkai kiri dan kanan.
  parts.push(`<line x1="${left}" y1="${top}" x2="${left}" y2="${top+gridH}" class="border"/>`);
  parts.push(`<line x1="${left+gridW}" y1="${top}" x2="${left+gridW}" y2="${top+gridH}" class="border"/>`);
  if(start===1) parts.push(`<rect x="${left-2}" y="${top-4}" width="${gridW+4}" height="5" class="nut"/>`);
  const marks=[];
  for(let s=0;s<6;s++){
    const f=frets[s], x=left+s*sx;
    if(f<0) marks.push(`<text x="${x}" y="${top-9}" text-anchor="middle" class="mark">×</text>`);
    else if(f===0) marks.push(`<circle cx="${x}" cy="${top-9}" r="4" class="open"/>`);
    else if(f>=start && f<=start+4){
      const rowH=gridH/6;
      const y=top+(f-start+.5)*rowH;
      marks.push(`<circle cx="${x}" cy="${y}" r="${small?5:7}" class="dot"/>`);
    }
  }
  if(start>1) parts.push(`<text x="${left-12}" y="${top+sy*.65}" class="pos">${start}fr</text>`);
  return `<svg class="diagram" viewBox="0 0 ${w} ${h}" role="img">${parts.join("")}${marks.join("")}</svg>`;
}

function card(root,type){
  const name=root+type.suffix;
  const f=getVoicing(root,type);
  const fing=f.map((x,i)=>x<0?"×":x===0?"0":x).join(" ");
  return `<article class="chord-card" data-root="${root}" data-type="${type.id}" data-name="${name.toLowerCase()}">
    <div class="chord-name">${name}</div>
    <div class="chord-type">${type.name}</div>
    ${diagramSVG(f,true)}
    <div class="card-footer"><span>${fing}</span><span>view →</span></div>
  </article>`;
}

const rootTabs=document.getElementById("rootTabs");
const rootFilter=document.getElementById("rootFilter");
const typeFilter=document.getElementById("typeFilter");
const search=document.getElementById("search");
const library=document.getElementById("library");

roots.forEach(r=>{
  rootTabs.insertAdjacentHTML("beforeend",`<button class="root-tab" data-root="${r}">${r}</button>`);
  rootFilter.insertAdjacentHTML("beforeend",`<option value="${r}">${r}</option>`);
});
types.forEach(t=>typeFilter.insertAdjacentHTML("beforeend",`<option value="${t.id}">${t.name}</option>`));

function render(){
  const rf=rootFilter.value, tf=typeFilter.value, q=search.value.trim().toLowerCase();
  let shown=0, html="";
  const selectedRoots=rf==="all"?roots:[rf];
  selectedRoots.forEach(root=>{
    const selectedTypes=tf==="all"?types:types.filter(t=>t.id===tf);
    const cards=selectedTypes.filter(t=>(root+t.suffix).toLowerCase().includes(q)||t.name.toLowerCase().includes(q)).map(t=>card(root,t)).join("");
    if(cards){
      html+=`<h2 class="group-title">${root}<span>chords</span></h2>${cards}`;
      shown+=selectedTypes.filter(t=>(root+t.suffix).toLowerCase().includes(q)||t.name.toLowerCase().includes(q)).length;
    }
  });
  library.innerHTML=html||`<div class="empty">Chord tidak ditemukan. Coba kata seperti <b>C</b>, <b>Am</b>, <b>7</b>, atau <b>sus4</b>.</div>`;
  document.getElementById("totalCount").textContent=shown;
  document.querySelectorAll(".root-tab").forEach(b=>b.classList.toggle("active",rf===b.dataset.root));
}
render();

rootTabs.addEventListener("click",e=>{
  if(!e.target.matches(".root-tab")) return;
  rootFilter.value=e.target.dataset.root; render();
});
[rootFilter,typeFilter,search].forEach(el=>el.addEventListener("input",render));
library.addEventListener("click",e=>{
  const c=e.target.closest(".chord-card"); if(!c)return;
  const root=c.dataset.root, type=types.find(t=>t.id===c.dataset.type), f=getVoicing(root,type);
  document.getElementById("modalContent").innerHTML=`
    <div class="detail">
      <div>${diagramSVG(f,false)}</div>
      <div>
        <div class="sub">${type.name}</div>
        <h2>${root}${type.suffix}</h2>
        <p>Standard tuning: E A D G B E. Diagram ini dibuat sebagai referensi posisi chord dan bisa memiliki beberapa voicing alternatif.</p>
        <ul>
          <li><b>Senar:</b> 6 → 1 dari kiri ke kanan</li>
          <li><b>Posisi:</b> ${f.map(x=>x<0?"×":x===0?"open":x).join(" · ")}</li>
          <li><b>Rumus:</b> ${type.tones.join(" - ")}</li>
        </ul>
      </div>
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.getElementById("modal").setAttribute("aria-hidden","false");
});
document.querySelectorAll("[data-close]").forEach(x=>x.addEventListener("click",closeModal));
function closeModal(){document.getElementById("modal").classList.remove("open");document.getElementById("modal").setAttribute("aria-hidden","true")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

document.getElementById("themeBtn").addEventListener("click",()=>{
  document.documentElement.classList.toggle("dark");
  localStorage.setItem("chordTheme",document.documentElement.classList.contains("dark")?"dark":"light");
});
if(localStorage.getItem("chordTheme")==="dark")document.documentElement.classList.add("dark");

  </script>
</body>
</html>
